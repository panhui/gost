<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOST · 隧道转发面板</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<section id="login" class="login-screen" hidden>
  <div class="login-art"><div class="logo big">g<span>→</span></div><h1>GOST 转发面板</h1><p>管理设备组与转发规则。<br>支持直接转发和 TLS 隧道。</p></div>
  <form id="login-form" class="login-form"><div class="logo">g<span>→</span></div><h2>登录控制台</h2><p class="muted">使用安装时设置的管理员密码</p><label>管理员密码<input type="password" name="password" autocomplete="current-password" required placeholder="请输入密码"></label><p class="form-error" id="login-error" role="alert"></p><button class="primary" type="submit">进入面板 <span>→</span></button></form>
</section>
<div id="shell" class="shell" hidden>
  <aside><a class="brand" href="/"><div class="logo">g<span>→</span></div><div>GOST <small>隧道转发面板</small></div></a><nav>
    <button class="nav active" data-page="overview"><span>◈</span>概览</button>
    <button class="nav" data-page="rules"><span>⇄</span>转发规则<i id="nav-rule-count">0</i></button>
    <button class="nav" data-page="nodes"><span>▦</span>设备组</button>
    <button class="nav" data-page="audit"><span>◷</span>操作记录</button>
    <button class="nav" data-page="settings"><span>⚙</span>系统设置</button>
  </nav><div class="sidebar-bottom"><div class="engine">GOST <strong id="gost-version">3.3.0</strong></div><button class="account" data-action="logout">退出登录 ↗</button></div></aside>
  <div class="workspace"><header><div class="breadcrumb"><b id="breadcrumb">概览</b></div><div class="header-right"><span id="refresh-state">等待同步</span><button class="icon-button" data-action="refresh" title="刷新数据" aria-label="刷新数据">↻</button></div></header>
    <main id="content"></main>
  </div>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
